<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כסף בכיף">
<title>כסף בכיף — הכסף של הבית בשליטה</title>
<meta name="description" content="בונים תקציב, רושמים הוצאות כמו בוואטסאפ, וחוסכים. האפליקציה המשפחתית לניהול כסף.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="toast" id="toast"></div>

  <header>
    <div class="logo">כסף בכיף ✨</div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="exportBtn" aria-label="הורדה לאקסל">📊</button>
      <button class="icon-btn" id="bell" aria-label="תובנות">🔔<i class="dot" id="bellDot" hidden></i></button>
      <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
    </div>
  </header>

  <main id="main">
    <section class="view on" id="v-chat">
      <div class="hero">
        <div class="streak" id="streak"></div>
        <small id="heroLabel">נשאר לך החודש</small>
        <div class="big" id="left">0₪</div>
        <div class="bar"><i id="usedBar" style="width:0"></i></div>
        <div class="row"><span id="usedPct"></span><span id="daysLeft"></span></div>
      </div>
      <div id="installBanner"></div>
      <div class="stories" id="stories"></div>
      <div class="chat" id="chat"></div>
    </section>

    <section class="view" id="v-budget">
      <div class="h2"><span>התקציב 🎯</span><div class="monthnav" data-monthnav></div></div>
      <div class="duo">
        <div class="stat" style="background:var(--g3)"><small>הכנסות</small><div id="incSum"></div></div>
        <div class="stat" style="background:linear-gradient(135deg,#F43F5E,#F97316)"><small>הוצאות</small><div id="expSum"></div></div>
      </div>
      <div class="cards">
        <button class="card tip" id="recoBtn"><div class="em">🪄</div><p><b>המלצה לתקציב לפי ההוצאות שלך</b><br>לחץ כדי לראות כמה כדאי להגדיר לכל קטגוריה</p></button>
        <div id="budgetList" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </section>

    <section class="view" id="v-insights">
      <div class="h2"><span>תובנות 💡</span><div class="monthnav" data-monthnav></div></div>
      <div class="donut" id="donut"><div><span>הוצאות</span><b id="donutSum"></b></div></div>
      <div class="legend" id="legend"></div>
      <div class="cards" id="tips"></div>
    </section>

    <section class="view" id="v-tx">
      <div class="h2"><span>תנועות 📋</span><div class="monthnav" data-monthnav></div></div>
      <div class="cards">
        <div>
          <input class="search" id="search" placeholder="חיפוש: סופר, טעינה, משכורת…">
          <div class="chips" id="txFilter"></div>
        </div>
        <div class="card" id="txList"></div>
      </div>
    </section>
  </main>

  <div class="composer" id="composer">
    <div class="chips" id="quick"></div>
    <div class="crow">
      <button class="round attach" id="attach" aria-label="קובץ או צילום">📎</button>
      <input id="inp" placeholder="מה הוצאת? למשל: סופר 230" autocomplete="off" enterkeyhint="send">
      <button class="round mic" id="mic" aria-label="הודעה קולית / שליחה">🎤</button>
    </div>
  </div>

  <nav>
    <button class="on" data-v="chat"><span>💬</span>צ'אט</button>
    <button data-v="budget"><span>🎯</span>תקציב</button>
    <button data-v="insights"><span>💡</span>תובנות</button>
    <button data-v="tx"><span>📋</span>תנועות</button>
  </nav>

  <div class="lock gate on" id="gate">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="logo">כסף בכיף ✨</div>
    <div id="gateBody" style="position:relative;width:100%;max-width:360px"><p class="sub" style="text-align:center">טוען…</p></div>
  </div>
  <div class="lock" id="lock">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="logo">כסף בכיף ✨</div>
    <h2>🔒 האפליקציה נעולה</h2>
    <button class="btn grad bio" id="lockBio" hidden>👆 פתיחה בטביעת אצבע / Face ID</button>
    <div class="sub" style="position:relative">או הקלדת קוד</div>
    <div class="dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
    <div class="err" id="lockErr" style="position:relative;margin:0"></div>
    <div class="pad" id="lockPad"></div>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
