<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0712">
<title>לוח בקרה</title>
<link rel="icon" href="../icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0712;--card:#15101F;--card2:#1C1530;--line:#2A2238;--ink:#F5F0FF;--soft:#B9AED6;--g:linear-gradient(135deg,#7C3AED,#EC4899 55%,#F97316);--gt:linear-gradient(135deg,#0EA5E9,#14B8A6 60%,#22C55E)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{font:inherit;font-weight:700;border:none;border-radius:14px;padding:10px 14px;background:var(--card2);color:var(--ink);cursor:pointer}
.btn.g{background:var(--g);color:#fff}
.sub{color:var(--soft);font-size:14px}
input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;margin-bottom:10px;outline:none}
.login{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.login h2{margin-bottom:6px}.login .btn{width:100%;margin-top:4px;padding:14px}
.err{color:#FDA4AF;min-height:22px;font-size:14px;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;animation:pop .5s both}
.stat b{display:block;font-size:28px;font-weight:800}
.stat span{font-size:13px;color:var(--soft)}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}.stat:nth-child(4){animation-delay:.15s}.stat:nth-child(5){animation-delay:.2s}.stat:nth-child(6){animation-delay:.25s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs button{flex:none;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:9px 14px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:transparent}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;animation:pop .4s both}
.row{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card2)}
.name{font-weight:700;font-size:17px}
.mail{font-size:13px;color:var(--soft);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.when{margin-inline-start:auto;text-align:left;font-size:13px;color:var(--soft);white-space:nowrap}
.when b{display:block;font-size:14px;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;background:#4B4266}
.dot.on{background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--card2);color:#E9D5FF}
.chip.k{background:rgba(124,58,237,.25)}.chip.z{background:rgba(20,184,166,.22);color:#99F6E4}.chip.l{background:rgba(249,115,22,.25);color:#FED7AA}
.chip.inst{background:rgba(34,197,94,.2);color:#86EFAC}.chip.web{background:rgba(249,115,22,.18);color:#FDBA74}
.chip.err{background:rgba(244,63,94,.2);color:#FDA4AF}
.emsg{font-family:ui-monospace,Menlo,monospace;font-size:13px;direction:ltr;text-align:left;background:var(--card2);border-radius:10px;padding:8px;margin-top:8px;word-break:break-word}
.empty{text-align:center;color:var(--soft);padding:30px 10px}
.foot{margin-top:18px;text-align:center}
/* 🐞 תקלות: פתוחה / תוקנה */
.est{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px}
.est.open{background:rgba(244,63,94,.22);color:#FDA4AF}
.est.fixed{background:rgba(34,197,94,.2);color:#86EFAC}
.times{font-size:13px;font-weight:800;color:#FDE68A;background:rgba(250,204,21,.14);border-radius:999px;padding:3px 9px}
.fixnote{margin-top:8px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:8px 10px;font-size:14px}
.fixnote small{display:block;color:var(--soft);font-size:12.5px;margin-top:2px}
.fixbox{margin-top:10px;display:grid;gap:8px}
.fixbox textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px;font:inherit;font-size:15px;resize:vertical;outline:none}
.fixbox input{margin:0;height:44px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts[hidden]{display:none}
.btn.ok{background:linear-gradient(135deg,#22C55E,#14B8A6);color:#fff}
.again{font-size:12.5px;color:#FDBA74;margin-top:6px}
details.fixed-sec{margin-top:6px}
details.fixed-sec>summary{list-style:none;cursor:pointer;font-weight:800;font-size:16px;background:var(--card);border:1px solid rgba(34,197,94,.35);border-radius:16px;padding:12px 14px}
details.fixed-sec>summary::-webkit-details-marker{display:none}
details.fixed-sec>summary::after{content:'▾';float:left;color:var(--soft);transition:transform .25s}
details.fixed-sec[open]>summary::after{transform:rotate(180deg)}
details.fixed-sec .list{margin-top:10px}
.card.done{opacity:.85}
.sub.ltr{direction:ltr;text-align:right;word-break:break-all;font-size:12.5px}
@media(max-width:380px){.stat b{font-size:24px}.mail{max-width:52vw}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="empty">טוען…</div></div>

<script src="../vendor/supabase.js"></script>
<script type="module">
import { CONFIG } from '../js/config.js';
const sb = window.supabase.createClient(CONFIG.url, CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rtf = new Intl.RelativeTimeFormat('he', { numeric: 'auto' });
function ago(t) {
  if (!t) return 'אף פעם';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'עכשיו';
  if (s < 3600) return rtf.format(-Math.round(s / 60), 'minute');
  if (s < 86400) return rtf.format(-Math.round(s / 3600), 'hour');
  if (s < 86400 * 30) return rtf.format(-Math.round(s / 86400), 'day');
  return new Date(t).toLocaleDateString('he-IL');
}
const fresh = t => t && Date.now() - new Date(t) < 15 * 60 * 1000;
const APPN = { kesef: ['k', '💰 כסף'], zman: ['z', '⏰ זמן'], lomdim: ['l', '🎮 לומדים'] };
let DATA = null, tab = 'people', timer = null;
const DEMO = location.hostname === 'localhost' && location.search.includes('demo');

async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  await load();
}

function login(msg = '') {
  clearInterval(timer);
  $('#root').innerHTML = `<div class="login"><h2>🔐 לוח בקרה</h2><p class="sub" style="margin-bottom:14px">כניסה עם החשבון של כסף בכיף / זמן בכיף</p>
    <input id="em" type="email" autocomplete="email" placeholder="מייל">
    <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה">
    <div class="err" id="er">${esc(msg)}</div><button class="btn g" id="go">כניסה</button></div>`;
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { $('#er').textContent = /Invalid/.test(error.message) ? 'המייל או הסיסמה לא נכונים' : error.message; $('#go').disabled = false; return; }
    load();
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
}

async function load() {
  const { data, error } = await sb.rpc('admin_overview');
  if (error) {
    if (/not allowed/.test(error.message)) { await sb.auth.signOut(); return login('אין הרשאה לחשבון הזה'); }
    $('#root').innerHTML = `<div class="empty">⚠️ ${esc(/fetch|network/i.test(error.message) ? 'אין חיבור לאינטרנט' : error.message)}<br><br><button class="btn" onclick="location.reload()">🔄 לנסות שוב</button></div>`;
    return;
  }
  DATA = data; draw();
  clearInterval(timer); timer = setInterval(async () => { if (document.hidden) return; const r = await sb.rpc('admin_overview'); if (!r.error) { DATA = r.data; draw(); } }, 60000);
}

// תקלה = אותה אפליקציה + הודעה + מקום בקוד. פתוחה אם יש לה מופע שלא סומן "תוקנה"
function groupErrs(errs) {
  const g = new Map();
  for (const e of errs) {
    const k = `${e.app}|${e.message}|${e.source}`;
    if (!g.has(k)) g.set(k, { k, app: e.app, message: e.message, source: e.source, open: [], fixed: [] });
    g.get(k)[e.fixed_at ? 'fixed' : 'open'].push(e);
  }
  return [...g.values()].map(x => ({ ...x, last: [...x.open, ...x.fixed].reduce((m, e) => (e.at > m ? e.at : m), '') }))
    .sort((a, b) => b.last.localeCompare(a.last));
}
function lastSeen(u) { return (u.devices || []).reduce((m, d) => (!m || d.last_seen > m ? d.last_seen : m), null) || u.last_sign_in_at; }

function draw() {
  const users = DATA.users || [], errs = DATA.errors || [], week = Date.now() - 7 * 86400000;
  const devs = [...users.flatMap(u => u.devices || []), ...(DATA.anon_devices || [])];
  const installed = users.filter(u => (u.devices || []).some(d => d.standalone)).length;
  const active = users.filter(u => { const t = lastSeen(u); return t && new Date(t) > week; }).length;
  const openErrs = groupErrs(errs).filter(x => x.open.length).length;
  $('#root').innerHTML = `<div class="top"><a class="btn" href="../" style="text-decoration:none">→ לאפליקציה</a><h1>📊 לוח בקרה</h1></div>
    <div class="stats">
      <div class="stat"><b>${users.length}</b><span>👥 משתמשים</span></div>
      <div class="stat"><b>${active}</b><span>🔥 פעילים השבוע</span></div>
      <div class="stat"><b>${installed}</b><span>📲 התקינו</span></div>
      <div class="stat"><b>${(DATA.households || []).length}</b><span>💰 משפחות</span></div>
      <div class="stat"><b>${(DATA.groups || []).length}</b><span>⏰ קבוצות</span></div>
      <div class="stat"><b style="color:${openErrs ? '#FDA4AF' : '#86EFAC'}">${openErrs}</b><span>🐞 תקלות פתוחות</span></div>
    </div>
    <div class="tabs">${[['people', '👥 אנשים'], ['fam', '🏠 משפחות וקבוצות'], ['errs', `🐞 תקלות (${openErrs})`], ['devs', `📱 מכשירים (${devs.length})`]].map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="list" id="list"></div>
    <div class="foot sub">עודכן ${ago(DATA.now)} · מתעדכן לבד כל דקה <button class="btn" id="rf" style="margin-inline-start:8px">🔄</button></div>`;
  $('#rf').onclick = load;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  ({ people: drawPeople, fam: drawFam, errs: drawErrs, devs: drawDevs })[tab](users, errs, devs);
}

function devChips(list) {
  return (list || []).map(d => `<span class="chip ${APPN[d.app]?.[0] || ''}">${APPN[d.app]?.[1] || esc(d.app)}</span><span class="chip ${d.standalone ? 'inst' : 'web'}">${d.standalone ? '📲 מותקן' : '🌐 דפדפן'} · ${esc(d.device || '')}</span>`).join('');
}
function drawPeople(users) {
  const list = [...users].sort((a, b) => String(lastSeen(b) || '').localeCompare(String(lastSeen(a) || '')));
  $('#list').innerHTML = list.length ? list.map((u, i) => {
    const t = lastSeen(u);
    return `<div class="card" style="animation-delay:${Math.min(i, 10) * .04}s"><div class="row">
      <div class="av">${esc(u.emoji || '🙂')}</div>
      <div style="min-width:0"><div class="name">${esc(u.name || 'בלי שם')}</div><div class="mail">${esc(u.email)}</div></div>
      <div class="when"><b><span class="dot ${fresh(t) ? 'on' : ''}"></span>${ago(t)}</b>נרשם ${new Date(u.created_at).toLocaleDateString('he-IL')}</div></div>
      <div class="chips">
        <span class="chip k">💰 ${u.kesef_week} השבוע · ${u.kesef_total} סה"כ</span>
        <span class="chip z">⏰ ${u.zman_week} השבוע · ${u.zman_total} סה"כ</span>
        ${devChips(u.devices) || '<span class="chip">עוד לא נפתח מאז שהמעקב נוסף</span>'}
      </div></div>`;
  }).join('') : '<div class="empty">עוד אין משתמשים</div>';
}
function drawFam(users) {
  const byId = Object.fromEntries(users.map(u => [u.id, u]));
  const who = id => { const u = byId[id]; return u ? `${esc(u.emoji || '🙂')} ${esc(u.name || u.email)}` : '❔'; };
  const hh = (DATA.households || []).map(h => `<div class="card"><div class="row"><div class="av">💰</div><div><div class="name">${esc(h.name)}</div><div class="sub">כסף בכיף · נפתחה ${new Date(h.created_at).toLocaleDateString('he-IL')}</div></div></div>
    <div class="chips">${(h.members || []).map(m => `<span class="chip k">${m.role === 'child' ? '🧒' : '👨‍👩'} ${who(m.user_id)}</span>`).join('')}</div></div>`);
  const gr = (DATA.groups || []).map(g => `<div class="card"><div class="row"><div class="av">⏰</div><div><div class="name">${esc(g.name)}</div><div class="sub">זמן בכיף · נפתחה ${new Date(g.created_at).toLocaleDateString('he-IL')}</div></div></div>
    <div class="chips">${(g.members || []).map(m => `<span class="chip z">${m.role === 'child' ? '🧒' : m.role === 'admin' ? '⭐' : '🙂'} ${m.user_id ? who(m.user_id) : esc(m.nickname) + ' (רק שם)'}</span>`).join('')}</div></div>`);
  $('#list').innerHTML = [...hh, ...gr].join('') || '<div class="empty">עוד אין משפחות</div>';
}
function drawErrs(users, errs) {
  const groups = groupErrs(errs), open = groups.filter(x => x.open.length), done = groups.filter(x => !x.open.length);
  const day = t => new Date(t).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' });
  const head = (x, rows, st) => {
    const devs = new Set(rows.map(e => e.device).filter(Boolean)), mails = [...new Set(rows.map(e => e.email).filter(Boolean))];
    return `<div class="row" style="flex-wrap:wrap"><span class="chip ${APPN[x.app]?.[0] || ''}">${APPN[x.app]?.[1] || esc(x.app)}</span>
      <span class="est ${st}">${st === 'open' ? '🔴 פתוחה' : '✅ תוקנה'}</span>${rows.length > 1 ? `<span class="times">×${rows.length}</span>` : ''}
      <div class="when"><b>${ago(rows[0].at)}</b>${devs.size > 1 ? `${devs.size} מכשירים` : esc([...devs][0] || '')}</div></div>
      <div class="emsg">${esc(x.message)}${x.source ? '<br>📍 ' + esc(x.source) : ''}</div>
      <div class="sub" style="margin-top:6px">${rows.length > 1 ? `🕐 ראשונה ${ago(rows[rows.length - 1].at)} · אחרונה ${ago(rows[0].at)}` : `🕐 ${ago(rows[0].at)}`}</div>
      ${mails.length ? `<div class="sub ltr">👤 ${esc(mails.join(' · '))}</div>` : ''}${rows[0].version ? `<div class="sub ltr">🏷️ ${esc(rows[0].version)}</div>` : ''}`;
  };
  const fixInfo = f => `<div class="fixnote">✅ ${esc(f.fixed_note || '')}<small>תוקנה ${day(f.fixed_at)}${f.fixed_version ? ` · גרסה <span style="direction:ltr;unicode-bidi:isolate">${esc(f.fixed_version)}</span>` : ''}</small></div>`;
  const openCard = x => `<div class="card" data-g="${esc(x.k)}">${head(x, x.open, 'open')}
      ${x.fixed.length ? `<div class="again">⚠️ חזרה אחרי תיקון (${day(x.fixed[0].fixed_at)}: ${esc(x.fixed[0].fixed_note || '')})</div>` : ''}
      <div class="acts"><button class="btn ok" data-fix="${x.open[0].id}">✅ סמן כמתוקנת</button></div></div>`;
  const doneCard = x => `<div class="card done">${head(x, x.fixed, 'fixed')}${fixInfo(x.fixed[0])}
      <div class="acts"><button class="btn" data-reopen="${x.fixed[0].id}">↩️ לפתוח מחדש</button></div></div>`;
  $('#list').innerHTML = (open.length ? open.map(openCard).join('') : '<div class="empty">🎉 אין תקלות פתוחות</div>')
    + (done.length ? `<details class="fixed-sec"><summary>✅ תוקנו (${done.length})</summary><div class="list">${done.map(doneCard).join('')}</div></details>` : '');
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => {
    const acts = b.parentElement; if (acts.nextElementSibling?.classList.contains('fixbox')) return;
    const box = document.createElement('div'); box.className = 'fixbox';
    box.innerHTML = `<textarea placeholder="מה תוקן? משפט קצר בעברית פשוטה, למשל: הכפתור 'שמור' כבר לא נתקע"></textarea>
      <input placeholder="גרסה (לא חובה), למשל kesef-20261021…" dir="ltr"><div class="err"></div>
      <div class="acts" style="margin:0"><button class="btn ok">💾 שמירה — תוקנה</button><button class="btn">ביטול</button></div>`;
    acts.after(box); acts.hidden = true; box.querySelector('textarea').focus();
    const [save, cancel] = box.querySelectorAll('.acts .btn');
    cancel.onclick = () => { box.remove(); acts.hidden = false; };
    save.onclick = async () => {
      const note = box.querySelector('textarea').value.trim(), ver = box.querySelector('input').value.trim();
      if (note.length < 3) { box.querySelector('.err').textContent = 'צריך משפט קצר שמסביר מה תוקן'; return; }
      save.disabled = true;
      if (DEMO) { for (const e of DATA.errors) if (`${e.app}|${e.message}|${e.source}` === b.closest('[data-g]').dataset.g && !e.fixed_at) Object.assign(e, { fixed_at: new Date().toISOString(), fixed_version: ver, fixed_note: note }); draw(); return; }
      const { error } = await sb.rpc('admin_fix_error', { p_id: Number(b.dataset.fix), p_version: ver, p_note: note });
      if (error) { box.querySelector('.err').textContent = error.message; save.disabled = false; return; }
      const r = await sb.rpc('admin_overview'); if (!r.error) { DATA = r.data; draw(); }
    };
  });
  document.querySelectorAll('[data-reopen]').forEach(b => b.onclick = async () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '⚠️ בטוח? לחץ שוב'; return; }
    if (DEMO) { const t = DATA.errors.find(e => String(e.id) === b.dataset.reopen); for (const e of DATA.errors) if (e.app === t.app && e.message === t.message && e.source === t.source) Object.assign(e, { fixed_at: null, fixed_version: null, fixed_note: null }); draw(); return; }
    const { error } = await sb.rpc('admin_reopen_error', { p_id: Number(b.dataset.reopen) });
    if (error) { alert(error.message); return; }
    const r = await sb.rpc('admin_overview'); if (!r.error) { DATA = r.data; draw(); }
  });
}
function drawDevs(users, errs, devs) {
  const owner = new Map(users.flatMap(u => (u.devices || []).map(d => [d, u])));
  $('#list').innerHTML = devs.length ? [...devs].sort((a, b) => String(b.last_seen).localeCompare(String(a.last_seen))).map(d => {
    const u = owner.get(d);
    return `<div class="card"><div class="row"><div class="av">${d.standalone ? '📲' : '🌐'}</div><div style="min-width:0"><div class="name">${esc(d.device || 'מכשיר')}</div>
      <div class="sub">${u ? esc(u.name || u.email) : 'לא מחובר'} · נפתח ${d.opens} פעמים</div></div>
